spring.application.name=ledger-api
server.port=8080

# In-memory H2 database; data resets on restart. Swap the URL for PostgreSQL in production.
spring.datasource.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Expose /actuator/health for Docker and Kubernetes health checks
management.endpoints.web.exposure.include=health
